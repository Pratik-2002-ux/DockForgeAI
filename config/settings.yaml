  interaction_results: data/processed/interaction_results
  interaction_tables: data/processed/interaction_tables
  interaction_reports: data/processed/interaction_reports
  interaction_figures: data/processed/interaction_figures
  screening_inputs: data/raw/screening_libraries
  standardized_library: data/processed/screening_library/standardized
  filtered_library: data/processed/screening_library/filtered
  screening_ligand_sdf: data/processed/screening_library/sdf
  screening_ligand_pdbqt: data/processed/screening_library/pdbqt
  screening_runs: data/processed/screening_runs
  screening_tables: data/processed/screening_tables
  screening_reports: data/processed/screening_reports
  failed_ligands: data/processed/screening_library/failed
  admet_inputs: data/raw/admet
  admet_tables: data/processed/admet_tables
  prioritization_tables: data/processed/prioritization_tables
  prioritization_reports: data/processed/prioritization_reports
  prioritization_figures: data/processed/prioritization_figures
  report_assets: data/processed/report_assets
  pdf_reports: data/processed/final_reports/pdf
  html_reports: data/processed/final_reports/html
  report_figures: data/processed/report_assets/figures
  molecule_images: data/processed/report_assets/molecules
  final_reports: data/processed/final_reports
  xai_chembl_raw: data/raw/xai/chembl
  xai_dude_raw: data/raw/xai/dude_hivpr
  xai_interim: data/interim/xai
  xai_dataset: data/processed/xai_dataset
  xai_reports: data/processed/xai_reports
  xai_exclusions: data/processed/xai_exclusions
  xai_logs: logs/xai_dataset
  xai_features: data/processed/xai_features
  xai_models: data/processed/xai_models
  xai_predictions: data/processed/xai_predictions
  xai_explanations: data/processed/xai_explanations
  xai_benchmarks: data/processed/xai_benchmarks
  xai_figures: data/processed/xai_figures
  xai_final_reports: data/processed/xai_final_reports
  xai_model_cards: data/processed/xai_model_cards

rcsb:
  structure_url: "https://files.rcsb.org/download/{pdb_id}.pdb"
  metadata_url: "https://data.rcsb.org/rest/v1/core/entry/{pdb_id}"

network:
  timeout_seconds: 30

docking:
  vina_executable: vina
  meeko_export_executable: mk_export.py
  timeout_seconds: 7200
  cpu: 4
  exhaustiveness: 8
  num_modes: 10
  energy_range: 4
  seed: 2026
  redocking_rmsd_threshold_angstrom: 2.0

interactions:
  preferred_engine: plip
  hydrogen_bond_distance_angstrom: 3.5
  hydrogen_bond_angle_degrees: 120
  hydrophobic_distance_angstrom: 4.0
  salt_bridge_distance_angstrom: 4.0
  pi_stacking_distance_angstrom: 5.5
  catalytic_residues:
    - A:25
    - B:25

visualization:
  protein_ligand_viewer:
    receptor:
      path: data/processed/protonated_receptors/1HSG_chains-A-B_receptor.pdb
      format: pdb
    poses:
      crystallographic:
        path: data/processed/crystallographic_ligands/1HSG_MK1_crystallographic_corrected.sdf
        format: sdf
      rank_1_redocked:
        path: data/processed/docking_poses/1HSG_MK1/pose_001.pdbqt
        format: pdbqt
    docking_pose_directory: data/processed/docking_poses/1HSG_MK1
    redocking_summary_path: data/processed/docking_results/1HSG_MK1_redocking_summary.json
    catalytic_residues:
      - A:25
      - B:25

virtual_screening:
  max_library_size: 500
  chunk_size: 25
  concurrent_jobs: 1
  cpu_per_job: 4
  screening_exhaustiveness: 4
  screening_num_modes: 3
  screening_energy_range: 3
  refinement_exhaustiveness: 16
  refinement_num_modes: 10
  refinement_energy_range: 4
  top_fraction_for_refinement: 0.10
  minimum_refinement_count: 10
  maximum_refinement_count: 30
  seed: 2026
  timeout_per_ligand_seconds: 1800
  resume: true

prioritization:
  docking_weight: 0.30
  interaction_weight: 0.25
  druglikeness_weight: 0.20
  structural_alert_weight: 0.10
  ligand_efficiency_weight: 0.15
  missing_external_admet_policy: neutral
  top_hits_to_report: 10

xai_dataset:
  target_chembl_id: CHEMBL243
  dude_target_id: HIVPR
  target_compound_count: 2000
  target_active_count: 1000
  target_decoy_count: 1000
  active_pchembl_threshold: 6.0
  ambiguous_lower_threshold: 5.0
  standard_activity_types:
    - IC50
    - Ki
    - Kd
    - EC50
  minimum_target_confidence_score: 8
  random_seed: 2026
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  maximum_molecular_weight: 750
  minimum_heavy_atoms: 5
  maximum_formal_charge: 3
  minimum_formal_charge: -3
  request_timeout_seconds: 60
  request_retries: 4
  request_page_size: 1000
  cache_downloads: true
  resume: true

xai_modeling:
  dataset_path: data/processed/xai_dataset/hivpr_xai_2000_compounds.csv
  label_column: binary_label
  split_column: dataset_split
  scaffold_column: scaffold_id
  positive_label: active
  negative_label: inactive_or_decoy
  random_seed: 2026
  seeds: [2026, 2027, 2028, 2029, 2030]
  primary_selection_metric: pr_auc
  bootstrap_iterations: 500
  fingerprint:
    radius: 2
    n_bits: 2048
    use_chirality: true
    use_counts: false
  maccs_enabled: true
  calibration_methods: [none, sigmoid, isotonic]
  applicability_domain:
    top_k_neighbors: 5
    similarity_quantile_threshold: 0.05
    descriptor_distance_quantile_threshold: 0.95
  explainability:
    top_global_features: 30
    local_explanation_count_per_category: 20
    background_sample_size: 100
    fingerprint_example_count: 5
  reports:
    include_all_seed_tables: true
    include_local_examples: true
    include_ablation_results: true

project:
  name: DockForgeAI
  version: "1.0.0"

directories:
  raw_proteins: data/raw/proteins
  protein_metadata: data/raw/protein_metadata
  protein_reports: data/processed/protein_reports
  prepared_proteins: data/processed/proteins
  extracted_ligands: data/processed/extracted_ligands
  preparation_reports: data/processed/preparation_reports
  crystallographic_ligands: data/processed/crystallographic_ligands
  docking_ready_ligands: data/processed/docking_ready_ligands
  ligand_pdbqt: data/processed/pdbqt/ligands
  protonated_receptors: data/processed/protonated_receptors
  receptor_pdbqt: data/processed/pdbqt/receptors
  docking_boxes: data/processed/docking_boxes
  docking_configs: config/docking
  docking_runs: data/processed/docking_runs
  docking_poses: data/processed/docking_poses
  docking_results: data/processed/docking_results
  docking_tables: data/processed/docking_tables
  docking_reports: data/processed/docking_reports
  standardized_ligands: data/processed/standardized_ligands
  minimized_ligands: data/processed/minimized_ligands
  ligand_reports: data/processed/ligand_reports
  raw_ligands: data/raw/ligands
  processed_data: data/processed
  external_data: data/external
  logs: logs
  reports: reports

rcsb:
  structure_url: "https://files.rcsb.org/download/{pdb_id}.pdb"
  metadata_url: "https://data.rcsb.org/rest/v1/core/entry/{pdb_id}"

network:
  timeout_seconds: 30

docking:
  vina_executable: vina
  meeko_export_executable: mk_export.py
  timeout_seconds: 7200
  cpu: 4
  exhaustiveness: 8
  num_modes: 10
  energy_range: 4
  seed: 2026
  redocking_rmsd_threshold_angstrom: 2.0
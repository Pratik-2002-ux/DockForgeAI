project:
  name: DockForgeAI
  version: "1.0.0"

directories:
  raw_proteins: data/raw/proteins
  protein_metadata: data/raw/protein_metadata
  protein_reports: data/processed/protein_reports
  raw_ligands: data/raw/ligands
  processed_data: data/processed
  external_data: data/external
  logs: logs
  reports: reports

rcsb:
  structure_url: "https://files.rcsb.org/download/{pdb_id}.pdb"
  metadata_url: "https://data.rcsb.org/rest/v1/core/entry/{pdb_id}"

network:
  timeout_seconds: 30